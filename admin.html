<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Review dashboard — AI Flixs</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="assets/style.css" />
  <style>
    .admin-wrap { max-width: 860px; margin: 0 auto; padding: 120px 20px 80px; }
    .admin-wrap h1 { font-size: 30px; font-weight: 800; letter-spacing: -0.5px; margin-bottom: 6px; }
    .admin-wrap .sub { color: var(--muted); margin-bottom: 30px; }
    .queue-card { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 24px; margin-bottom: 20px; }
    .queue-card h2 { font-size: 18px; }
    .queue-card .info { color: var(--muted); font-size: 13px; margin: 4px 0 14px; }
    .queue-card iframe { width: 100%; aspect-ratio: 16 / 9; border: 0; border-radius: 10px; background: #000; margin-bottom: 14px; }
    .queue-actions { display: flex; gap: 10px; }
    .btn-approve { background: #1d7a3d; color: #fff; }
    .btn-approve:hover { background: #249649; }
    .btn-reject { background: transparent; color: var(--accent-hover); border-color: var(--accent); }
    .pill { display: inline-block; font-size: 11px; font-weight: 700; padding: 3px 10px; border-radius: 999px; background: var(--surface-2); color: var(--muted); margin-left: 8px; }
  </style>
</head>
<body>
  <nav class="nav">
    <a href="index.html" class="logo">AI FLI<span class="x">X</span>S<span class="logo-tag">AI · FILM · FUTURE</span></a>
    <div class="nav-links">
      <a href="index.html">Browse</a>
      <a href="admin.html" class="active">Review</a>
    </div>
  </nav>

  <main class="admin-wrap">
    <h1>Review dashboard</h1>
    <p class="sub">Approve films to publish them; reject anything that breaks the rules.</p>
    <div id="queue"><p style="color:var(--muted)">Loading…</p></div>
  </main>

  <script src="assets/config.js?v=7"></script>
  <script src="assets/app.js?v=7"></script>
  <script>
    const queueEl = document.getElementById("queue");
    const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) =>
      ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
    const gb = (b) => (b / 1024 ** 3).toFixed(2) + " GB";

    async function loadQueue() {
      const r = await fetch(window.AF_CONFIG.API_BASE + "/admin.php");
      const d = await r.json();
      if (d.error === "not_signed_in") {
        queueEl.innerHTML = '<p style="color:var(--muted)">Please <a href="signup.html" style="color:var(--accent)">sign in</a> with the admin account.</p>';
        return;
      }
      if (d.error === "forbidden") {
        queueEl.innerHTML = '<p style="color:var(--muted)">This account doesn\'t have review access.</p>';
        return;
      }
      if (!d.queue || !d.queue.length) {
        queueEl.innerHTML = '<p style="color:var(--muted)">🎉 Queue is empty — nothing awaiting review.</p>';
        return;
      }
      queueEl.innerHTML = d.queue.map((f) =>
        '<div class="queue-card" id="film-' + f.id + '">' +
          "<h2>" + esc(f.title) + '<span class="pill">' + esc(f.status) + "</span>" +
          '<span class="pill">' + (f.price_cents == 0 ? "FREE + ads" : "$" + (f.price_cents / 100).toFixed(2)) + "</span></h2>" +
          '<p class="info">by ' + esc(f.display_name) + " (@" + esc(f.handle) + " · " + esc(f.email) + ") · " +
            f.width + "×" + f.height + " · " + gb(f.size_bytes) + " · submitted " + esc(f.created_at) + " UTC</p>" +
          '<p class="info">' + esc(f.synopsis) + "</p>" +
          (f.preview_url ? '<iframe src="' + f.preview_url + '" loading="lazy" allowfullscreen></iframe>'
                         : '<p class="info">⏳ Video not uploaded/processed yet.</p>') +
          '<div class="queue-actions">' +
            '<button class="btn btn-approve" onclick="act(' + f.id + ', \'approve\')">✓ Approve &amp; publish</button>' +
            '<button class="btn btn-ghost btn-reject" onclick="act(' + f.id + ', \'reject\')">✕ Reject</button>' +
          "</div></div>"
      ).join("");
    }

    async function act(id, action) {
      if (action === "reject" && !confirm("Reject this film?")) return;
      const r = await fetch(window.AF_CONFIG.API_BASE + "/admin.php", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ film_id: id, action }),
      });
      const d = await r.json();
      if (d.ok) document.getElementById("film-" + id).remove();
      else alert("Action failed: " + (d.error || "unknown"));
    }
    loadQueue();
  </script>
</body>
</html>
