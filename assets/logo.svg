<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 132 100" role="img" aria-label="AI Flixs">
  <defs>
    <linearGradient id="silver" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="45%" stop-color="#e9ecf4"/>
      <stop offset="70%" stop-color="#a8adbd"/>
      <stop offset="100%" stop-color="#eef0f6"/>
    </linearGradient>
    <linearGradient id="pb" x1="0" y1="0" x2="0.5" y2="1">
      <stop offset="0%" stop-color="#c05bff"/>
      <stop offset="45%" stop-color="#7c5cff"/>
      <stop offset="100%" stop-color="#2f7cf6"/>
    </linearGradient>
    <linearGradient id="play" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#6d4aff"/>
    </linearGradient>
  </defs>

  <!-- A -->
  <path d="M6 94 L38 6 L56 6 L88 94 L69 94 L47 32 L25 94 Z" fill="url(#silver)"/>

  <!-- play triangle inside the A -->
  <path d="M38 52 L62 64 L38 76 Z" fill="url(#play)" stroke="url(#play)" stroke-width="7"
        stroke-linejoin="round" stroke-linecap="round"/>

  <!-- I as a film strip -->
  <rect x="96" y="6" width="30" height="88" rx="2" fill="url(#pb)"/>
  <g fill="#050508">
    <rect x="100" y="12" width="6" height="7" rx="1.4"/>
    <rect x="100" y="25" width="6" height="7" rx="1.4"/>
    <rect x="100" y="38" width="6" height="7" rx="1.4"/>
    <rect x="100" y="51" width="6" height="7" rx="1.4"/>
    <rect x="100" y="64" width="6" height="7" rx="1.4"/>
    <rect x="100" y="77" width="6" height="7" rx="1.4"/>
    <rect x="116" y="12" width="6" height="7" rx="1.4"/>
    <rect x="116" y="25" width="6" height="7" rx="1.4"/>
    <rect x="116" y="38" width="6" height="7" rx="1.4"/>
    <rect x="116" y="51" width="6" height="7" rx="1.4"/>
    <rect x="116" y="64" width="6" height="7" rx="1.4"/>
    <rect x="116" y="77" width="6" height="7" rx="1.4"/>
  </g>

  <!-- pixel dissolve off the top-right -->
  <g fill="url(#pb)">
    <rect x="119" y="0" width="7" height="7" rx="1"/>
    <rect x="128" y="6" width="4" height="4" rx="0.8" opacity=".85"/>
    <rect x="127" y="15" width="5" height="5" rx="1" opacity=".6"/>
    <rect x="121" y="-8" width="5" height="5" rx="1" opacity=".7"/>
    <rect x="129" y="-4" width="3" height="3" rx="0.6" opacity=".45"/>
  </g>
</svg>
