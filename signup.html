<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign up — AI Flixs</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="assets/style.css" />
</head>
<body>
  <nav class="nav">
    <a href="index.html" class="logo">AI FLI<span class="x">X</span>S<span class="logo-tag">AI · FILM · FUTURE</span></a>
    <div class="nav-links">
      <a href="index.html">Browse</a>
      <a href="about.html" class="hide-sm">About</a>
      <a href="upload.html">Submit a film</a>
    </div>
  </nav>

  <main class="auth-wrap">
    <div class="card">
      <h1>Create your account</h1>
      <p class="sub">Watch AI films, follow creators, unlock premieres.</p>

      <div id="gsi-button" style="display:flex; justify-content:center; min-height:44px"></div>
      <button class="btn btn-google btn-block" id="google-fallback" onclick="AF.signInWithGoogle()">
        <svg width="18" height="18" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 0 1-2.2 3.32v2.77h3.57c2.08-1.92 3.27-4.74 3.27-8.1z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84A11 11 0 0 0 12 23z"/><path fill="#FBBC05" d="M5.84 14.1A6.6 6.6 0 0 1 5.5 12c0-.73.13-1.44.34-2.1V7.06H2.18a11 11 0 0 0 0 9.88l3.66-2.84z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15A11 11 0 0 0 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/></svg>
        Continue with Google
      </button>

      <div class="divider">or with email</div>

      <form onsubmit="event.preventDefault(); AF.signUpWithEmail(this.email.value, this.password.value)">
        <div class="field">
          <label for="email">Email</label>
          <input id="email" name="email" type="email" placeholder="you@example.com" required />
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input id="password" name="password" type="password" placeholder="8+ characters" minlength="8" required />
        </div>
        <button type="submit" class="btn btn-primary btn-block">Create account</button>
      </form>

      <p class="fine">Already have an account? <a href="#" onclick="AF.signInWithGoogle(); return false;">Sign in</a></p>
    </div>
  </main>

  <script src="assets/config.js?v=7"></script>
  <script src="assets/app.js?v=7"></script>
</body>
</html>
